<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Roomkit — repaint a room's walls in any colour">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170d09"/><stop offset="0.55" stop-color="#2a1409"/><stop offset="1" stop-color="#130b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a865"/><stop offset="0.6" stop-color="#d3763f"/><stop offset="1" stop-color="#a94f2b"/>
    </linearGradient>
    <linearGradient id="paintSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d3a2c"/><stop offset="1" stop-color="#33201b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1712"/><stop offset="1" stop-color="#0d0807"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 187h1200M0 375h1200M0 562h1200M300 0v750M600 0v750M900 0v750"/>
  </g>

  <!-- Room: back wall newly painted, left wall still bare -->
  <rect x="250" y="110" width="700" height="430" fill="url(#paint)"/>
  <polygon points="70,640 250,540 250,110 70,30" fill="url(#paintSide)"/>
  <polygon points="70,640 250,540 250,556 70,660" fill="#000000" opacity="0.25"/>

  <!-- Window on the painted wall -->
  <rect x="762" y="170" width="132" height="196" rx="4" fill="url(#light)"/>
  <g stroke="#000000" stroke-opacity="0.35" stroke-width="7">
    <path d="M828 170v196M762 268h132"/>
  </g>
  <rect x="762" y="170" width="132" height="196" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>

  <!-- Skirting and floor -->
  <rect x="250" y="526" width="700" height="14" fill="#ffffff" opacity="0.13"/>
  <path d="M0 540h1200v210H0z" fill="url(#floor)"/>
  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M250 540L140 750M950 540L1060 750M0 636h1200"/>
  </g>

  <!-- Furniture left where it was -->
  <g fill="#1d1210" opacity="0.92">
    <rect x="330" y="462" width="272" height="78" rx="14"/>
    <rect x="322" y="418" width="288" height="52" rx="16" fill="#241614"/>
  </g>
  <g fill="#ffffff" opacity="0.07">
    <rect x="352" y="428" width="104" height="34" rx="10"/>
    <rect x="470" y="428" width="118" height="34" rx="10"/>
  </g>

  <!-- The dropped colour -->
  <circle cx="596" cy="300" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 9"/>
  <circle cx="596" cy="300" r="19" fill="#f6b07a"/>
  <circle cx="596" cy="300" r="19" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Palette: kept high enough that a wide hero crop cannot cut it off -->
  <g>
    <rect x="452" y="562" width="296" height="68" rx="34" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="486" cy="596" r="21" fill="#f4a865"/><circle cx="486" cy="596" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="556" cy="596" r="21" fill="#7f9c7a"/><circle cx="556" cy="596" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="626" cy="596" r="21" fill="#6b7fd7"/><circle cx="626" cy="596" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="696" cy="596" r="21" fill="#e8d5b5"/><circle cx="696" cy="596" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  </g>
</svg>
